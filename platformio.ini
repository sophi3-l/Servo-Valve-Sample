; Karen Valve System — build environments share include/calibration.h.
;   pio run -e calibrate  -t upload   (find open/close angles + `setid`, over serial)
;   pio run -e deploy     -t upload   (deep-sleep flight build)
;   pio run -e minideploy -t upload   (deploy build, short timings — full run in
;                                      minutes; SSID gets a -TEST tag; DO NOT SEAL)
; Build in VS Code via the PlatformIO sidebar → Project Tasks → <env>.

[platformio]
default_envs = deploy

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.3
; upload_port is auto-detected; uncomment and set only if detection grabs the wrong device.
; upload_port = COM6

[env:deploy]
build_src_filter = -<*> +<deploy/>

; Same source as deploy; MINI_DEPLOY only swaps the default timings + tags the SSID.
[env:minideploy]
build_src_filter = -<*> +<deploy/>
build_flags = -DMINI_DEPLOY

[env:calibrate]
build_src_filter = -<*> +<calibrate/>