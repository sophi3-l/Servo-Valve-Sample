; Karen Valve System — build environments share include/calibration.h and
; include/schedule.h.
;
;   pio run -e calibrate  -t upload   (find open/close angles + `setid`, over serial)
;   pio run -e deploy     -t upload   (deep-sleep flight build, 18-day schedule)
;   pio run -e minideploy -t upload   (same source, compressed waits — ~55 min run;
;                                      SSID gets a -TEST tag; DO NOT SEAL)
;
; Build in VS Code via the PlatformIO sidebar -> Project Tasks -> <env>.
; NOTE default_envs below: a bare `pio run` or an unqualified Upload button
; builds the FLIGHT firmware. Always name the environment explicitly.
;
; ---------------------------------------------------------------------------
; PORTABILITY: nothing in this file may reference a specific machine.
; Machine-specific paths live in .vscode/launch.json, .vscode/c_cpp_properties.json
; and .pio/ — all three are gitignored and must stay that way.
; ---------------------------------------------------------------------------

[platformio]
default_envs = deploy

[env]
; ---------------------------------------------------------------------------
; PLATFORM PINNING — read this before working on a second machine.
;
; The `stable` URL below is a MOVING TARGET: two machines cloning this repo on
; different days can resolve different ESP32 Arduino cores, which is the classic
; "builds on my laptop, not on the bench laptop" failure. For a flight build
; that is not acceptable.
;
; To pin, on the machine whose build is known good:
;     pio pkg list -e deploy
; note the espressif32 version it reports, then comment out the `stable` line
; and uncomment + edit the pinned line below. Commit that.
;
;     platform = https://github.com/pioarduino/platform-espressif32/releases/download/<VERSION>/platform-espressif32.zip
;
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/PIN_ME/platform-espressif32.zip

board = esp32dev
framework = arduino

; Exact versions, not carets. `^3.0.3` would silently accept any 3.x on a fresh
; clone. These are the versions the flight code has actually been built against.
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@3.0.3
    adafruit/Adafruit BusIO@1.17.4

; Warnings on project sources only (not the framework/libs, which are noisy).
build_src_flags = -Wall

monitor_speed = 115200
; `time` prepends a wall-clock timestamp to every serial line — the easiest way
; to confirm the scheduler is firing events when it says it is.
; For a full 55-minute mini-deploy, capture it to a file:
;     pio device monitor -e minideploy -f log2file
monitor_filters = default, time

; upload_port is auto-detected, which is what makes this portable across
; machines (the COM number differs on every laptop). Uncomment ONLY if
; detection grabs the wrong device, and do not commit that change.
; upload_port = COM6

[env:deploy]
build_src_filter = -<*> +<deploy/>

; Same source as deploy; MINI_DEPLOY compresses the schedule's waits (the valve
; routine still runs at full flight timing) and tags the SSID.
[env:minideploy]
build_src_filter = -<*> +<deploy/>
build_flags = -DMINI_DEPLOY

[env:calibrate]
build_src_filter = -<*> +<calibrate/>
